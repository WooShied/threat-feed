name: Daily digest

on:
  schedule:
    - cron: "17 14 * * *" # 14:17 UTC, morning in California
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update data and write digest
        run: python threatfeed.py update

      - name: Commit and push
        run: |
          git config user.name "Aadil Rashid"
          git config user.email "148400192+WooShied@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Digest $(date -u +%F)"
          git pull --rebase
          git push
